name: Build

on:
  push:
    branches:
      - "claude/**"
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with the jar"
        type: boolean
        default: false
      tag:
        description: "Tag to publish the release under"
        type: string
        default: "v1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ForgeGradle 2.1 and the 1.8.9 toolchain only run on Java 8.
      - name: Use Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"

      # setupDecompWorkspace decompiles Minecraft, which is slow and worth caching.
      - name: Cache gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-forgegradle-${{ hashFiles('build.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-forgegradle-

      - name: Set up the workspace
        run: ./gradlew setupDecompWorkspace --no-daemon --stacktrace

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Name the jar
        id: jar
        run: echo "path=$(ls build/libs/*.jar | grep -v sources | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: SilentAuth
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: SilentAuth ${{ inputs.tag || github.ref_name }}
          body: |
            SilentAuth for Minecraft 1.8.9, Forge 11.15.1.2318.

            Drop the jar into `.minecraft/mods`, start the game, and the
            SilentAuth button appears in the top left of the title and
            multiplayer screens.
          files: ${{ steps.jar.outputs.path }}
          draft: false
          prerelease: false
